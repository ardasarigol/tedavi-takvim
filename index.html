<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tedavi Takip — Hatırlatıcı Ekle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep: #0a4a3a;
    --green-mid:  #12735c;
    --green-soft: #e6f4f0;
    --green-pale: #f2faf7;
    --text:       #1a1a1a;
    --muted:      #6b7b76;
    --border:     #d4e5e0;
    --white:      #ffffff;
    --radius:     14px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--green-pale);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .container { width: 100%; max-width: 440px; }

  .header {
    text-align: center;
    margin-bottom: 1.75rem;
    animation: fadeUp 0.5s ease both;
  }

  .logo-mark {
    width: 60px;
    height: 60px;
    background: var(--green-deep);
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.85rem;
    font-weight: 400;
    color: var(--green-deep);
    line-height: 1.2;
  }

  .onboarding {
    background: var(--green-deep);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: fadeUp 0.5s 0.05s ease both;
  }

  .onboarding p {
    font-size: 1rem;
    color: #ffffff;
    line-height: 1.55;
    font-weight: 400;
  }

  .patient-select {
    margin-bottom: 1rem;
    animation: fadeUp 0.5s 0.08s ease both;
  }

  .select-label {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
    display: block;
  }

  .patient-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .patient-btn {
    padding: 16px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--white);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }

  .patient-btn:hover { border-color: var(--green-mid); background: var(--green-soft); }
  .patient-btn.selected { border-color: var(--green-deep); background: var(--green-soft); }

  .patient-btn-title {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .patient-btn-sub {
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .card {
    display: none;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .card.visible { display: block; }

  .card-section { padding: 1.25rem 1.5rem; }
  .card-section + .card-section { border-top: 1px solid var(--border); }

  .start-label {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .start-date {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--green-deep);
  }

  .reminder-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--green-soft);
  }

  .reminder-row:last-child { border-bottom: none; }

  .badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--green-mid);
    line-height: 1.2;
    text-align: center;
    white-space: pre-line;
  }

  .reminder-info { flex: 1; }
  .reminder-name { font-size: 1rem; font-weight: 500; color: var(--text); }
  .reminder-date { font-size: 0.875rem; color: var(--muted); margin-top: 2px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    background: var(--green-deep);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover { background: var(--green-mid); }
  .btn:active { transform: scale(0.98); }
  .btn.success { background: #085041; pointer-events: none; }

  .guidance {
    display: none;
    margin-top: 1rem;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .guidance.visible { display: block; }

  .guidance-header {
    background: var(--green-soft);
    padding: 0.9rem 1.25rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--green-deep);
  }

  .guidance-step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 0.9rem 1.25rem;
    border-top: 1px solid var(--border);
  }

  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--green-deep);
    color: white;
    font-size: 0.75rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text { font-size: 0.95rem; color: var(--text); line-height: 1.5; }

  .note {
    text-align: center;
    margin-top: 1.25rem;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.6;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-mark">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none">
        <rect x="4" y="6" width="20" height="18" rx="3" stroke="white" stroke-width="1.8"/>
        <line x1="9" y1="4" x2="9" y2="9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="19" y1="4" x2="19" y2="9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="4" y1="12" x2="24" y2="12" stroke="white" stroke-width="1.4"/>
        <line x1="14" y1="17" x2="14" y2="22" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="11" y1="19.5" x2="17" y2="19.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Tedavi Takibiniz</h1>
  </div>

  <div class="onboarding">
    <div style="font-size:22px;flex-shrink:0;margin-top:1px;">📅</div>
    <p>Tedavi takviminizi oluşturmak için lütfen hasta tipinizi seçin.</p>
  </div>

  <div class="patient-select">
    <span class="select-label">Hasta tipiniz</span>
    <div class="patient-btns">
      <div class="patient-btn" id="btn-naive" onclick="selectPatient('naive')">
        <div class="patient-btn-title">Naif Hasta</div>
        <div class="patient-btn-sub">Tedaviye bugün ilk kez başlıyorum</div>
      </div>
      <div class="patient-btn" id="btn-continuing" onclick="selectPatient('continuing')">
        <div class="patient-btn-title">Devamlı Hasta</div>
        <div class="patient-btn-sub">Tedavim daha önce başladı, bugün doz aldım</div>
      </div>
    </div>
  </div>

  <div class="card" id="card">
    <div class="card-section">
      <p class="start-label" id="startLabel">—</p>
      <p class="start-date" id="startDate">—</p>
    </div>
    <div class="card-section">
      <div id="reminderList"></div>
    </div>
    <div class="card-section">
      <button class="btn" id="downloadBtn" onclick="downloadICS()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Hatırlatıcıları Telefonuma Ekle
      </button>
    </div>
  </div>

  <div class="guidance" id="guidance">
    <div class="guidance-header">✅ Şimdi ne yapmalısınız?</div>
    <div id="guidanceSteps"></div>
  </div>

  <p class="note">iPhone ve Android takvim uygulamalarıyla uyumludur.</p>

</div>

<script>
  let computed = [];

  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
  function isAndroid() { return /Android/.test(navigator.userAgent); }

  function formatTR(d) {
    return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  }

  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function addMonths(date, n) {
    const d = new Date(date);
    d.setMonth(d.getMonth() + n);
    return d;
  }

  function pad(n) { return String(n).padStart(2, "0"); }
  function toICSDate(d) { return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()); }

  function selectPatient(type) {
    document.getElementById("btn-naive").classList.toggle("selected", type === "naive");
    document.getElementById("btn-continuing").classList.toggle("selected", type === "continuing");

    const today = new Date();
    computed = [];

    if (type === "naive") {
      const dose2 = addDays(today, 28);
      const dose3 = addMonths(dose2, 3);
      const dose4 = addMonths(dose3, 3);
      computed = [
        { label: "2. Doz", badge: "2.\nDoz", date: dose2 },
        { label: "3. Doz", badge: "3.\nDoz", date: dose3 },
        { label: "4. Doz", badge: "4.\nDoz", date: dose4 },
      ];
      document.getElementById("startLabel").textContent = "1. Doz — Başlangıç tarihi";
    } else {
      const nextDose = addMonths(today, 3);
      computed = [
        { label: "Sonraki Dozunuz", badge: "Sonr.\nDoz", date: nextDose },
      ];
      document.getElementById("startLabel").textContent = "Bugünkü Doz tarihi";
    }

    document.getElementById("startDate").textContent = formatTR(today);

    const list = document.getElementById("reminderList");
    list.innerHTML = "";
    computed.forEach((r) => {
      const row = document.createElement("div");
      row.className = "reminder-row";
      row.innerHTML = `
        <div class="badge">${r.badge}</div>
        <div class="reminder-info">
          <div class="reminder-name">${r.label}</div>
          <div class="reminder-date">${formatTR(r.date)}</div>
        </div>
      `;
      list.appendChild(row);
    });

    const btn = document.getElementById("downloadBtn");
    btn.className = "btn";
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Hatırlatıcıları Telefonuma Ekle
    `;
    document.getElementById("guidance").classList.remove("visible");
    document.getElementById("card").classList.add("visible");
    document.getElementById("card").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function downloadICS() {
    let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TedaviTakip//TR\r\nCALSCALE:GREGORIAN\r\n";

    computed.forEach((r, i) => {
      // 5 günlük geri sayım etkinlikleri — her gün ayrı etkinlik olarak takvimde görünür
      for (let daysLeft = 5; daysLeft >= 1; daysLeft--) {
        const alertDate = addDays(r.date, -daysLeft);
        const uid = "tedavi-" + i + "-countdown-" + daysLeft + "-" + Date.now() + "@tedavitakip";
        const dtstart = toICSDate(alertDate);
        const title = daysLeft === 1
          ? "⚠️ Yarın " + r.label + " — Kliniğinizi arayın!"
          : "📅 " + r.label + " için " + daysLeft + " gün kaldı";
        const desc = daysLeft === 1
          ? r.label + " için yarın kliniğinize başvurunuz, ihmal etmeyin!"
          : r.label + " için " + daysLeft + " gün kaldı, ihmal etmeyin!";

        ics += "BEGIN:VEVENT\r\n";
        ics += "UID:" + uid + "\r\n";
        ics += "DTSTART;VALUE=DATE:" + dtstart + "\r\n";
        ics += "DTEND;VALUE=DATE:" + dtstart + "\r\n";
        ics += "SUMMARY:" + title + "\r\n";
        ics += "DESCRIPTION:" + desc + "\r\n";
        ics += "BEGIN:VALARM\r\nTRIGGER:-PT0S\r\nACTION:DISPLAY\r\nDESCRIPTION:" + desc + "\r\nEND:VALARM\r\n";
        ics += "END:VEVENT\r\n";
      }

      // Doz günü etkinliği
      const doseUid = "tedavi-" + i + "-doseday-" + Date.now() + "@tedavitakip";
      const doseDt = toICSDate(r.date);
      const doseDesc = "Bugün " + r.label + " günüdür. Lütfen kliniğinize başvurunuz.";
      ics += "BEGIN:VEVENT\r\n";
      ics += "UID:" + doseUid + "\r\n";
      ics += "DTSTART;VALUE=DATE:" + doseDt + "\r\n";
      ics += "DTEND;VALUE=DATE:" + doseDt + "\r\n";
      ics += "SUMMARY:💉 " + r.label + " — Klinik Randevusu\r\n";
      ics += "DESCRIPTION:" + doseDesc + "\r\n";
      ics += "BEGIN:VALARM\r\nTRIGGER:-PT0S\r\nACTION:DISPLAY\r\nDESCRIPTION:" + doseDesc + "\r\nEND:VALARM\r\n";
      ics += "END:VEVENT\r\n";
    });

    ics += "END:VCALENDAR";

    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tedavi-takvim.ics";
    a.click();
    URL.revokeObjectURL(url);

    const btn = document.getElementById("downloadBtn");
    btn.classList.add("success");
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Hatırlatıcılar İndirildi
    `;
    showGuidance();
  }

  function showGuidance() {
    const iosSteps = [
      "İndirilen dosya otomatik açılacak.",
      "Ekrana gelen pencerede \"Tümünü Ekle\" butonuna dokunun.",
      "Takvim uygulamanızı açarak hatırlatıcıları görebilirsiniz."
    ];
    const androidSteps = [
      "Telefonunuzun üst kısmından bildirimleri aşağı çekin.",
      "İndirilen \"tedavi-takvim.ics\" dosyasına dokunun.",
      "\"Google Takvim ile aç\" seçeneğini seçin.",
      "\"Takvime Ekle\" butonuna dokunun."
    ];
    const genericSteps = [
      "Telefonunuzun indirilenler klasörünü açın.",
      "\"tedavi-takvim.ics\" dosyasına dokunun.",
      "Takvim uygulamanızla açmayı seçin.",
      "Hatırlatıcıları onaylayın."
    ];

    const steps = isIOS() ? iosSteps : isAndroid() ? androidSteps : genericSteps;
    const stepsContainer = document.getElementById("guidanceSteps");
    stepsContainer.innerHTML = "";
    steps.forEach((text, i) => {
      const div = document.createElement("div");
      div.className = "guidance-step";
      div.innerHTML = `<div class="step-num">${i+1}</div><div class="step-text">${text}</div>`;
      stepsContainer.appendChild(div);
    });

    document.getElementById("guidance").classList.add("visible");
    document.getElementById("guidance").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  window.addEventListener("beforeunload", function(e) {
    const btn = document.getElementById("downloadBtn");
    if (!btn.classList.contains("success")) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
</script>
</body>
</html>
